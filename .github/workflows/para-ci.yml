# PARA-CODE: fork-owned file (Para Code) — not present in upstream microsoft/vscode. See CLAUDE.md.
#
# Lightweight CI for the fork: typecheck + hygiene + unit tests on GitHub-hosted
# runners only. The upstream pr.yml / pr-node-modules.yml / copilot-setup-steps.yml
# workflows require Microsoft's internal self-hosted runner pools
# (1ES.Pool=..., vscode-large-runners, macos-26-xlarge) that don't exist on this
# fork, so those were disabled via `gh workflow disable` instead of being edited.
name: Para CI

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  push:
    branches:
      - main

concurrency:
  group: para-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-and-hygiene:
    name: Typecheck & Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-para-ci
          key-args: "compile $(node -p process.arch)"

      - name: Install build tools
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save node_modules cache
        if: github.event_name != 'pull_request' && steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-node-modules

      # Since 1.139 src/tsconfig.base.json reads Electron's typings from .build/typings/electron.d.ts,
      # which postinstall downloads. The node_modules cache skips postinstall and never archives .build/,
      # so a cache hit would otherwise type-check without Electron types (upstream pr.yml does the same).
      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Type check /build/ scripts
        run: npm run typecheck
        working-directory: build

      - name: Check Markdown editor manifests
        run: |
          npm run markdown-editor-package-json-check
          npm --prefix extensions/markdown-language-features run test-markdown-editor-package-json

      # The runner was shut down (exit 143) about 40 s into tsgo-typecheck on every run, before it could report
      # anything: running core-ci in parallel with hygiene, eslint and the other checks ran the runner out of memory
      #, most likely. Compile and type check first on their own, then run the remaining checks in parallel.
      - name: Compile & type check
        run: npm run core-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # hygiene always reports product.json's extensionsGallery (an intentional fork change, see NOTES.md
      # "hygieneチェックとproduct.jsonの既知の衝突"). Pass only when that is the single finding: one such line and
      # "Hygiene failed with 1 errors.". Any other finding changes the count, and other failures (such as
      # check-package-json) print no count line, so both still fail the step. build/hygiene.ts is not changed.
      - name: Hygiene
        if: success() || failure()
        run: |
          log="$RUNNER_TEMP/hygiene.log"
          set +e
          npm run hygiene 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          known=$(grep -cF "product.json: Contains 'extensionsGallery'" "$log" || true)
          if [ "$known" -eq 1 ] && grep -qF "Hygiene failed with 1 errors." "$log"; then
            echo "::notice::hygiene reported only the known product.json extensionsGallery finding (see NOTES.md), so it counts as passed."
            exit 0
          fi
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Run these one after another: in parallel they still ran the runner out of memory (shutdown, exit 143).
      # --continue-on-error lets every check finish and report; the step still fails if any of them failed.
      - name: Other checks
        if: success() || failure()
        run: npm exec -- npm-run-all2 -l --continue-on-error valid-layers-check define-class-fields-check vscode-dts-compile-check tsec-compile-check test-build-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # eslint alone still ran the runner out of memory (shutdown, exit 143) when it shared the runner with the
      # checks above, so it gets its own step.
      - name: ESLint
        if: success() || failure()
        run: npm run eslint

      - name: Check cyclic dependencies
        run: node build/lib/checkCyclicDependencies.ts out-build

  unit-tests:
    name: Unit Tests (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-para-ci
          key-args: "compile $(node -p process.arch)"

      # npm ci builds native modules (kerberos needs gssapi.h from libkrb5-dev) whenever the
      # node_modules cache misses, e.g. after package-lock.json changes. Same tools as above.
      - name: Install build tools
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # test/unit/node/index.js loads the tests from out/, so without this step no
      # test file was found and the job stayed green while running 0 tests. Same transpile
      # step as upstream pr-linux-test.yml (esbuild, no type check: Typecheck & Hygiene covers it).
      - name: Transpile client
        run: npm run gulp transpile-client-esbuild

      # Fail when mocha did not report any passing test (e.g. out/ missing or a loader error
      # that stops mocha before it starts), instead of exiting 0 with nothing run.
      - name: Run unit tests (node.js)
        run: |
          set -o pipefail
          npm run test-node 2>&1 | tee "$RUNNER_TEMP/test-node.log"
          grep -Eq '(^|[^0-9])[1-9][0-9]* passing' "$RUNNER_TEMP/test-node.log" || { echo "No passing tests reported by test-node" >&2; exit 1; }

  # The fork's renderer (Electron) unit tests: unit-tests above runs only the node.js tests, so regressions in the
  # Electron tests reached main unnoticed (PR #868). Only the fork's suites run: those under vs/paradis, and the
  # fork's renderer and electron-main tests elsewhere, named paradis* or para<Capital>* (para[A-Z] keeps upstream
  # files such as parameterHintsModel and parallelTasksTour out). test/node is left out because test-node already runs it and the renderer cannot create Workers or use
  # SharedArrayBuffer (16 tests always fail there); electron-main is included because test-node skips it.
  # The job does not block CI yet (continue-on-error) because of known failures, such as the Office performance
  # fixture hash that is re-measured only on the reference Mac. The failed test names go to the job summary.
  # out/ is transpiled here again instead of shared with unit-tests: the transpile takes about 20 s, less than
  # uploading and downloading out/ as an artifact, and the job runs in parallel instead of after unit-tests.
  browser-unit-tests:
    name: Unit Tests (Electron, fork suites)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-para-ci
          key-args: "compile $(node -p process.arch)"

      - name: Install build tools
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Needed on every run, also when the node_modules cache hits: Xvfb for the test window, and the libraries
      # that Electron loads (same packages as upstream pr-linux-test.yml).
      - name: Install Xvfb and Electron libraries
        run: sudo apt update -y && sudo apt install -y xvfb libgtk-3-0 libgbm1

      - name: Transpile client
        run: npm run gulp transpile-client-esbuild

      - name: Setup Electron
        uses: ./.github/actions/setup-electron
        with:
          arch: x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ELECTRON_DISABLE_SANDBOX: chrome-sandbox is not a root-owned SUID binary here, and Electron stops at startup
      # without it. --workers does not apply together with --runGlob, so the tests run in one window.
      # The step fails when the tests fail or when no passing test was reported (0 tests must not turn green).
      - name: Run unit tests (Electron, fork suites)
        run: |
          log="$RUNNER_TEMP/test-electron.log"
          set +e
          xvfb-run -a ./scripts/test.sh --runGlob '{vs/paradis/**/test/{common,browser,electron-browser,electron-main}/**/*.test.js,**/test/{browser,electron-browser,electron-main}/**/{paradis,para[A-Z]}*.test.js}' 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          clean="$RUNNER_TEMP/test-electron.clean.log"
          sed 's/\x1b\[[0-9;]*m//g' "$log" > "$clean"
          count() { grep -Eo "^ *[0-9]+ $1" "$clean" | tail -1 | grep -Eo '[0-9]+' || echo 0; }
          passing=$(count passing)
          pending=$(count pending)
          failing=$(count failing)
          {
            echo "### Unit Tests (Electron, fork suites)"
            echo
            echo "| passing | pending | failing | exit code |"
            echo "|---|---|---|---|"
            echo "| $passing | $pending | $failing | $status |"
            if [ "$failing" -gt 0 ]; then
              echo
              echo "Failed tests:"
              echo
              awk '
                /^ *[0-9]+ failing/ { inFailures = 1; next }
                !inFailures { next }
                /^  [0-9]+\) / { collecting = 1; title = $0; sub(/^ +/, "", title); if (title ~ /:$/) { print "- " substr(title, 1, length(title) - 1); collecting = 0 }; next }
                collecting { line = $0; sub(/^ +/, "", line); title = title " > " line; if (line ~ /:$/) { print "- " substr(title, 1, length(title) - 1); collecting = 0 } }
              ' "$clean"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$passing" -eq 0 ]; then
            echo "::error::No passing tests reported by the Electron unit tests"
            exit 1
          fi
          exit "$status"
        env:
          ELECTRON_DISABLE_SANDBOX: 1
          VSCODE_SKIP_PRELAUNCH: 1

  fork-workspace-tests:
    name: Para Code Fork Workspace (typecheck & test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Update Worker dependencies
        working-directory: cloudflare/update-server
        run: npm ci

      - name: Install mobile workspace dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Type check and test Update Worker
        working-directory: cloudflare/update-server
        run: |
          npm run typecheck
          npm test

      - name: Type check and test mobile workspace
        working-directory: app
        run: |
          pnpm typecheck
          pnpm test

  copilot-checks:
    name: Copilot Extension (typecheck, lint, unit test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: extensions/copilot/.nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: copilot-node_modules-linux
          key-args: "$(node -p process.platform) $(node -p process.arch)"

      - name: Install root dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-workspaces

      - name: Install copilot dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: extensions/copilot
        run: npm ci

      - name: TypeScript type checking
        working-directory: extensions/copilot
        run: npm run typecheck

      - name: Lint
        working-directory: extensions/copilot
        run: npm run lint

      - name: Run vitest unit tests
        working-directory: extensions/copilot
        run: npm run test:unit
