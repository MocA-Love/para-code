# PARA-CODE: fork-owned workflow (Para Code) — not present in upstream microsoft/vscode. See CLAUDE.md.
#
# Builds signed (macOS) / unsigned (Windows, phase 1 — see NOTES.md) / unsigned
# (Linux) release packages for Para Code and publishes them:
#   1. Build artifacts upload to Cloudflare R2 (not GitHub Releases — this repo
#      is private and browser_download_url requires auth we don't want to give
#      end-user machines).
#   2. Release metadata (version/commit/url/sha256hash) is written to the
#      RELEASES KV namespace consumed by cloudflare/update-server, which is
#      what src/vs/platform/update/electron-main/*.ts polls.
#
# Required secrets (none of these exist yet — see NOTES.md release-infra
# section for the Cloudflare-side setup checklist):
#   APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD,
#     APPLE_CODESIGN_IDENTITY, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
#     APPLE_TEAM_ID                        — macOS signing + notarization
#   CF_API_TOKEN, CF_ACCOUNT_ID            — wrangler kv access (KV-only token; CI, not OAuth)
#   CF_R2_ACCESS_KEY_ID/_SECRET_ACCESS_KEY  — S3 credentials of a bucket-scoped
#     R2 API token (Object Read & Write on the artifacts bucket only)
#   CF_R2_BUCKET                            — R2 bucket name for artifacts
#   CF_KV_NAMESPACE_ID                      — RELEASES KV namespace id
#   PARA_UPDATE_ACCESS_CLIENT_ID/_SECRET    — stamped into product.json by
#     build/gulpfile.vscode.ts so the client sends Cloudflare Access service
#     token headers (see abstractUpdateService.ts getUpdateAccessHeaders)
#   SENTRY_AUTH_TOKEN                       — source map upload only (never shipped)
#
# Windows code signing is intentionally deferred (unsigned builds ship first,
# see NOTES.md) — Azure Trusted Signing wiring is a follow-up phase.
#
# Channels (decided by the `classify` job, logic in build/lib/paradisReleaseChannel.ts):
#   - Stable tag `v<ver>-paracode-<N>`: every platform, R2 `stable/...`, KV `stable:*` +
#     `changelog:stable`, GitHub Release marked Latest. These outputs are exactly what this
#     workflow wrote before channels existed; `$CHANNEL` below always expands to `stable`. The one
#     deliberate change is `--notes-start-tag <previous stable tag>` on `gh release create`.
#   - Beta tag `v<ver>-paracode-<N>-beta.<M>`: macOS (x64 + arm64) only, product.json gets
#     `paradisUpdateChannel: "beta"` (quality stays `stable`), R2 `beta/...`, KV `beta:darwin`,
#     `beta:darwin-arm64` and `changelog:beta` only (`stable:*` is never touched), and the GitHub
#     Release is a prerelease that is never marked Latest.
#   - Any other tag: rejected by `classify`, nothing is built or published.
#   - A branch (workflow_dispatch): builds only; publishing happens from release tags only.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated subset to build for debugging (darwin,win32,linux). Empty = all; publishes only when run on a release tag.'
        required: false
        default: ''
      dictation_runtime:
        # Off until the Foundry Local Core license (Microsoft Software License Terms, not MIT) is
        # cleared for Para Code users. Tag pushes never stamp it. See NOTES.md.
        description: 'Stamp the upstream dictation runtime download URL into product.json (license review pending).'
        required: false
        type: boolean
        default: false
      computer_use_helper:
        # The Swift helper app for Computer Use (B3). Its build, pre-notarization and embedding all use
        # continue-on-error, so a failure ships Para Code without it. Set false to skip it entirely.
        description: 'Build, pre-notarize and embed the Computer Use helper app (macOS). False ships without it.'
        required: false
        type: boolean
        default: true

env:
  PARA_UPDATE_ACCESS_CLIENT_ID: ${{ secrets.PARA_UPDATE_ACCESS_CLIENT_ID }}
  PARA_UPDATE_ACCESS_CLIENT_SECRET: ${{ secrets.PARA_UPDATE_ACCESS_CLIENT_SECRET }}

jobs:
  # Decides channel, platforms and whether this run may publish, before anything is built.
  # Later jobs read these outputs (`needs.classify.outputs.*`); build jobs also get them as
  # PARA_UPDATE_CHANNEL / PARA_RELEASE_IS_BETA so beta-only steps can key off them (for example
  # a macOS helper step that must fail the beta but not the stable release:
  # `continue-on-error: ${{ needs.classify.outputs.is_beta != 'true' }}`).
  classify:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      channel: ${{ steps.plan.outputs.channel }}
      is_beta: ${{ steps.plan.outputs.is_beta }}
      publish: ${{ steps.plan.outputs.publish }}
      build_darwin: ${{ steps.plan.outputs.build_darwin }}
      build_win32: ${{ steps.plan.outputs.build_win32 }}
      build_linux: ${{ steps.plan.outputs.build_linux }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .nvmrc
            build/lib/paradisReleaseChannel.ts
          sparse-checkout-cone-mode: false
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Classify the ref
        id: plan
        env:
          PARA_RELEASE_PLATFORMS: ${{ github.event.inputs.platforms }}
        run: node build/lib/paradisReleaseChannel.ts

      # Empty outputs would skip every later job and leave a green run that published nothing.
      # Fail loudly instead so a stable tag never silently goes unreleased.
      - name: Fail on an empty plan
        env:
          KIND: ${{ steps.plan.outputs.kind }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          PUBLISH: ${{ steps.plan.outputs.publish }}
        run: |
          if [ -z "$KIND" ] || [ -z "$CHANNEL" ] || [ -z "$PUBLISH" ]; then
            echo "::error::The release plan is empty (kind='$KIND' channel='$CHANNEL' publish='$PUBLISH'); nothing would be built or published."
            exit 1
          fi

  build-darwin:
    needs: classify
    if: ${{ needs.classify.outputs.build_darwin == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: macos-14
    env:
      NPM_ARCH: ${{ matrix.arch }}
      VSCODE_ARCH: ${{ matrix.arch }}
      # Read by build/gulpfile.vscode.ts: `beta` stamps product.json's paradisUpdateChannel, `stable` stamps nothing.
      PARA_UPDATE_CHANNEL: ${{ needs.classify.outputs.channel }}
      PARA_RELEASE_IS_BETA: ${{ needs.classify.outputs.is_beta }}
      # Read by build/gulpfile.vscode.ts to stamp product.json's dictationRuntime (see the step below).
      DICTATION_RUNTIME_RESULTS_FILE: ${{ github.workspace }}/.build/dictation-runtime/darwin-${{ matrix.arch }}.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # All LFS objects are Copilot simulation-test caches excluded from the packaged extension.
          # Avoid making production releases depend on the repository's GitHub LFS download budget.
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          set -e
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail fast if the copilot extension postinstall didn't materialize the SDK
      # payload — packaging would otherwise die much later in
      # prepareBuiltInCopilotRipgrepShim with less context (seen once on arm64,
      # run 28631291130; source tree was proven identical to the passing x64 job,
      # so instrument rather than guess).
      - name: Verify copilot SDK layout
        run: |
          if [ ! -f "extensions/copilot/node_modules/@github/copilot/sdk/index.d.ts" ] && [ ! -d "extensions/copilot/node_modules/@github/copilot/sdk" ]; then
            echo "::error::@github/copilot SDK was not materialized by the extension postinstall"
            ls -la extensions/copilot/node_modules/@github/ 2>/dev/null || echo "(no @github dir in extension node_modules)"
            ls -la node_modules/@github/ 2>/dev/null || echo "(no @github dir in root node_modules)"
            exit 1
          fi
          echo "SDK OK:"
          ls extensions/copilot/node_modules/@github/copilot/sdk | head

      # Upstream's built-in dictation downloads its native runtime (Foundry Local + onnxruntime)
      # on first use, because packaging strips it from node_modules (getFoundryLocalExcludeFilter).
      # The download URL only reaches product.json when this step writes the results file; without
      # it the mic button shows up but dictation fails. VSCODE_PUBLISH is unset, so this never
      # uploads anything: it only stamps upstream's CDN URL. Off by default: the runtime is under
      # Microsoft's Foundry Local Core license terms, which are still under review (NOTES.md).
      - name: Stamp dictation runtime URL
        if: ${{ github.event.inputs.dictation_runtime == 'true' }}
        run: node build/dictation-runtime/produce.ts --vscode-platform=darwin --arch=${{ matrix.arch }}

      # The stamped URL is built from package.json's foundry-local-sdk version without touching the
      # network, so check that the CDN really has that version before shipping it.
      - name: Check dictation runtime on the CDN
        if: ${{ github.event.inputs.dictation_runtime == 'true' }}
        shell: bash
        run: |
          TEMPLATE="$(node -p "require(process.env.DICTATION_RUNTIME_RESULTS_FILE).urlTemplate")"
          for target in darwin-arm64 win32-x64 win32-arm64 linux-x64; do
            url="${TEMPLATE/\{target\}/$target}"
            curl -fsSIL --retry 3 "$url" > /dev/null || { echo "::error::dictation runtime not found on the CDN: $url"; exit 1; }
            echo "OK $url"
          done

      - name: Package (vscode-darwin-${{ matrix.arch }}-min)
        run: npm run gulp "vscode-darwin-${{ matrix.arch }}-min"

      # Computer Use helper (B3), step 1 of 3. A universal Swift app built with swiftc; the same helper goes
      # into both the x64 and the arm64 package. Must run after "Package": the gulp task skips the helper on CI
      # (CI env) so that only a pre-notarized helper is embedded below. Never fails the release.
      - name: Build Computer Use helper
        if: ${{ github.event.inputs.computer_use_helper != 'false' }}
        continue-on-error: true
        run: |
          xcrun swiftc --version
          node build/paradis/computerUse/buildHelper.ts --out .build/paradis/computerUse

      - name: Upload desktop source maps to Sentry
        run: node build/sentry/upload-desktop-sourcemaps.ts darwin "${{ matrix.arch }}"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Packaging failure diagnostics
        if: failure()
        run: |
          echo "--- source extension @github ---"
          ls -la extensions/copilot/node_modules/@github/ 2>/dev/null || echo missing
          echo "--- .build/extensions/copilot @github ---"
          ls -la .build/extensions/copilot/node_modules/@github/ 2>/dev/null || echo missing
          ls .build/extensions/copilot/node_modules/@github/copilot/ 2>/dev/null | head -40 || true
          echo "--- packaged app extension @github ---"
          APP_DIR="$(dirname "$GITHUB_WORKSPACE")/VSCode-darwin-${{ matrix.arch }}"
          ls "$APP_DIR/$(node -p "require('./product.json').nameLong").app/Contents/Resources/app/extensions/copilot/node_modules/@github/" 2>/dev/null || echo missing
          echo "--- disk space ---"
          df -h . || true

      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$RUNNER_TEMP/buildagent.keychain"
          security default-keychain -s "$RUNNER_TEMP/buildagent.keychain"
          security unlock-keychain -p "" "$RUNNER_TEMP/buildagent.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/buildagent.keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$RUNNER_TEMP/buildagent.keychain"
          rm -f "$RUNNER_TEMP/cert.p12"

      # Computer Use helper, step 2 of 3: sign the helper alone with the release identity (hardened runtime,
      # timestamp, empty entitlements) and notarize it by itself, so a rejection caused by the helper shows up
      # here with its log instead of failing the notarization of the whole app. Writes the "prenotarized"
      # marker only when Apple accepted it; without the marker the helper is not embedded.
      - name: Pre-notarize Computer Use helper
        if: ${{ github.event.inputs.computer_use_helper != 'false' }}
        continue-on-error: true
        # Apple's queue can be slow; never let the optional helper hold the release job.
        timeout-minutes: 25
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          HELPER_DIR=".build/paradis/computerUse"
          HELPER="$HELPER_DIR/Para Code Computer Use.app"
          rm -f "$HELPER_DIR/prenotarized"
          if [ ! -d "$HELPER" ]; then
            echo "::warning::Computer Use helper was not built; shipping without it"
            exit 0
          fi
          reject() {
            echo "::warning::Computer Use helper pre-notarization failed ($1); shipping without it"
            rm -rf "$HELPER"
            exit 1
          }
          codesign --force --options runtime --timestamp \
            --entitlements build/paradis/computerUse/paradis-computer-use-entitlements.plist \
            --keychain "$RUNNER_TEMP/buildagent.keychain" --sign "$CODESIGN_IDENTITY" "$HELPER" || reject "codesign"
          codesign --verify --strict --verbose=2 "$HELPER" || reject "codesign --verify"
          ditto -c -k --keepParent "$HELPER" "$RUNNER_TEMP/computer-use-helper.zip" || reject "zip"
          SUBMIT_JSON="$(xcrun notarytool submit "$RUNNER_TEMP/computer-use-helper.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 20m --output-format json)" || reject "notarytool submit"
          echo "$SUBMIT_JSON"
          SUBMISSION_ID="$(node -p 'JSON.parse(process.argv[1]).id' "$SUBMIT_JSON")"
          SUBMISSION_STATUS="$(node -p 'JSON.parse(process.argv[1]).status' "$SUBMIT_JSON")"
          if [ "$SUBMISSION_STATUS" != "Accepted" ]; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            reject "status $SUBMISSION_STATUS"
          fi
          touch "$HELPER_DIR/prenotarized"

      # Computer Use helper, step 3 of 3: copy the pre-notarized helper into Contents/Helpers. The next step
      # (sign.ts) re-signs it with the rest of the app. On any failure nothing half-copied is left behind.
      - name: Embed Computer Use helper
        id: embed_computer_use_helper
        if: ${{ github.event.inputs.computer_use_helper != 'false' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          HELPER_DIR=".build/paradis/computerUse"
          HELPER="$HELPER_DIR/Para Code Computer Use.app"
          APP="$(dirname "$GITHUB_WORKSPACE")/VSCode-darwin-${{ matrix.arch }}/$(node -p "require('./product.json').nameLong").app"
          if [ -f "$HELPER_DIR/prenotarized" ] && [ -d "$HELPER" ]; then
            # Both architectures must be present: the same helper ships in the x64 and the arm64 package.
            lipo "$HELPER/Contents/MacOS/ParadisComputerUse" -verify_arch arm64 x86_64
            node build/paradis/computerUse/embedHelper.ts "$APP" --helper "$HELPER"
          else
            echo "::notice::No pre-notarized Computer Use helper; shipping without it"
          fi

      - name: Remove a partially embedded Computer Use helper
        if: ${{ steps.embed_computer_use_helper.outcome == 'failure' }}
        run: rm -rf "$(dirname "$GITHUB_WORKSPACE")/VSCode-darwin-${{ matrix.arch }}/$(node -p "require('./product.json').nameLong").app/Contents/Helpers/Para Code Computer Use.app"

      - name: Code sign app (build/darwin/sign.ts; its only PARA-PATCH gives the Computer Use helper empty entitlements)
        env:
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: node build/darwin/sign.ts "$(dirname "$GITHUB_WORKSPACE")"

      - name: Zip signed app
        run: |
          set -e
          cd "$(dirname "$GITHUB_WORKSPACE")/VSCode-darwin-${{ matrix.arch }}"
          ditto -c -k --sequesterRsrc --keepParent "$(node -p "require('${{ github.workspace }}/product.json').nameLong").app" "$GITHUB_WORKSPACE/darwin-${{ matrix.arch }}.zip"

      - name: Notarize + staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          # PARA-PATCH: `notarytool submit --wait` は status が Invalid でも終了コード0を返すため、
          # 素通りして次の stapler が "Record not found" で落ちるだけになり、Appleが何を拒否したのかが
          # ログに残らない。status を見て自分で失敗させ、拒否理由(notarytool log)を必ず出す。
          SUBMIT_JSON="$(xcrun notarytool submit "darwin-${{ matrix.arch }}.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json)"
          echo "$SUBMIT_JSON"
          SUBMISSION_ID="$(node -p 'JSON.parse(process.argv[1]).id' "$SUBMIT_JSON")"
          SUBMISSION_STATUS="$(node -p 'JSON.parse(process.argv[1]).status' "$SUBMIT_JSON")"
          if [ "$SUBMISSION_STATUS" != "Accepted" ]; then
            echo "::error::Notarization returned status '$SUBMISSION_STATUS' for submission $SUBMISSION_ID"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi
          APP_DIR="$(dirname "$GITHUB_WORKSPACE")/VSCode-darwin-${{ matrix.arch }}"
          xcrun stapler staple "$APP_DIR/$(node -p "require('./product.json').nameLong").app"
          # Re-zip so the shipped artifact carries the stapled ticket.
          cd "$APP_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$(node -p "require('${{ github.workspace }}/product.json').nameLong").app" "$GITHUB_WORKSPACE/darwin-${{ matrix.arch }}.zip"

      - name: Compute sha256
        run: shasum -a 256 "darwin-${{ matrix.arch }}.zip" | cut -d' ' -f1 > "darwin-${{ matrix.arch }}.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: darwin-${{ matrix.arch }}
          path: |
            darwin-${{ matrix.arch }}.zip
            darwin-${{ matrix.arch }}.zip.sha256
          retention-days: 7

  build-win32:
    # Skipped for beta tags (macOS-only), otherwise the same platform selection as before.
    needs: classify
    if: ${{ needs.classify.outputs.build_win32 == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    # windows-latest switched to the VS 2026 image in June 2026, which
    # build/npm/preinstall.ts's toolchain check (VS 2022/2019 only) rejects.
    # windows-2022 is GitHub's documented label for staying on VS 2022.
    runs-on: windows-2022
    env:
      NPM_ARCH: ${{ matrix.arch }}
      VSCODE_ARCH: ${{ matrix.arch }}
      PARA_UPDATE_CHANNEL: ${{ needs.classify.outputs.channel }}
      DICTATION_RUNTIME_RESULTS_FILE: ${{ github.workspace }}/.build/dictation-runtime/win32-${{ matrix.arch }}.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # All LFS objects are Copilot simulation-test caches excluded from the packaged extension.
          # Avoid making production releases depend on the repository's GitHub LFS download budget.
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # See the darwin job: stamps the dictation runtime URL into product.json, uploads nothing.
      - name: Stamp dictation runtime URL
        if: ${{ github.event.inputs.dictation_runtime == 'true' }}
        run: node build/dictation-runtime/produce.ts --vscode-platform=win32 --arch=${{ matrix.arch }}

      - name: Check dictation runtime on the CDN
        if: ${{ github.event.inputs.dictation_runtime == 'true' }}
        shell: bash
        run: |
          TEMPLATE="$(node -p "require(process.env.DICTATION_RUNTIME_RESULTS_FILE).urlTemplate")"
          for target in darwin-arm64 win32-x64 win32-arm64 linux-x64; do
            url="${TEMPLATE/\{target\}/$target}"
            curl -fsSIL --retry 3 "$url" > /dev/null || { echo "::error::dictation runtime not found on the CDN: $url"; exit 1; }
            echo "OK $url"
          done

      - name: Package (vscode-win32-${{ matrix.arch }}-min)
        run: npm run gulp "vscode-win32-${{ matrix.arch }}-min"

      - name: Upload desktop source maps to Sentry
        run: node build/sentry/upload-desktop-sourcemaps.ts win32 "${{ matrix.arch }}"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Build Inno Setup updater helper + user installer
        run: |
          npm run gulp "vscode-win32-${{ matrix.arch }}-inno-updater"
          npm run gulp "vscode-win32-${{ matrix.arch }}-user-setup"

      # NOTE: unsigned on purpose for the first release phase (see NOTES.md).
      # SmartScreen will warn on first run and some AV heuristics may flag the
      # background updater; Azure Trusted Signing is a planned follow-up once
      # regional eligibility is confirmed.

      - name: Compute sha256
        shell: pwsh
        run: |
          # buildWin32Setup (build/gulpfile.vscode.win32.ts setupDir) writes the
          # installer to .build/win32-<arch>/user-setup/ inside the repo.
          $setup = Get-ChildItem -Path ".build\win32-${{ matrix.arch }}\user-setup\*.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "win32-${{ matrix.arch }}-user-setup.exe"
          (Get-FileHash "win32-${{ matrix.arch }}-user-setup.exe" -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii "win32-${{ matrix.arch }}-user-setup.exe.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: win32-${{ matrix.arch }}
          path: |
            win32-${{ matrix.arch }}-user-setup.exe
            win32-${{ matrix.arch }}-user-setup.exe.sha256
          retention-days: 7

  build-linux:
    # Skipped for beta tags (macOS-only), otherwise the same platform selection as before.
    needs: classify
    if: ${{ needs.classify.outputs.build_linux == 'true' }}
    runs-on: ubuntu-latest
    env:
      VSCODE_ARCH: x64
      PARA_UPDATE_CHANNEL: ${{ needs.classify.outputs.channel }}
      DICTATION_RUNTIME_RESULTS_FILE: ${{ github.workspace }}/.build/dictation-runtime/linux-x64.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # All LFS objects are Copilot simulation-test caches excluded from the packaged extension.
          # Avoid making production releases depend on the repository's GitHub LFS download budget.
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup system dependencies
        run: |
          set -e
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config libkrb5-dev libxkbfile-dev libssl-dev rpm

      # GitHub-hosted images no longer ship a Rust toolchain; the tunnel CLI
      # (cli/, cargo bin "code") is required by the .deb: dpkg-shlibdeps in
      # build/linux/dependencies-generator.ts hard-codes bin/<tunnelApplicationName>
      # into its dependency scan. Upstream builds it in a separate pipeline
      # (build/azure-pipelines/cli/cli-compile.yml) and drops it into
      # VSCode-linux-<arch>/bin — replicated inline here.
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tunnel CLI
        run: cargo build --release --bin=code
        working-directory: cli
        env:
          VSCODE_CLI_PRODUCT_JSON: ${{ github.workspace }}/product.json

      # See the darwin job: stamps the dictation runtime URL into product.json, uploads nothing.
      - name: Stamp dictation runtime URL
        if: ${{ github.event.inputs.dictation_runtime == 'true' }}
        run: node build/dictation-runtime/produce.ts --vscode-platform=linux --arch=x64

      - name: Check dictation runtime on the CDN
        if: ${{ github.event.inputs.dictation_runtime == 'true' }}
        shell: bash
        run: |
          TEMPLATE="$(node -p "require(process.env.DICTATION_RUNTIME_RESULTS_FILE).urlTemplate")"
          for target in darwin-arm64 win32-x64 win32-arm64 linux-x64; do
            url="${TEMPLATE/\{target\}/$target}"
            curl -fsSIL --retry 3 "$url" > /dev/null || { echo "::error::dictation runtime not found on the CDN: $url"; exit 1; }
            echo "OK $url"
          done

      - name: Package (vscode-linux-x64-min)
        run: npm run gulp "vscode-linux-x64-min"

      - name: Upload desktop source maps to Sentry
        run: node build/sentry/upload-desktop-sourcemaps.ts linux x64
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Place tunnel CLI into client build
        run: |
          set -e
          TUNNEL_NAME="$(node -p "require('./product.json').tunnelApplicationName")"
          CLIENT_DIR="$(dirname "$GITHUB_WORKSPACE")/VSCode-linux-x64"
          mkdir -p "$CLIENT_DIR/bin"
          cp cli/target/release/code "$CLIENT_DIR/bin/$TUNNEL_NAME"
          chmod +x "$CLIENT_DIR/bin/$TUNNEL_NAME"
          "$CLIENT_DIR/bin/$TUNNEL_NAME" --version

      - name: Build .deb
        run: |
          npm run gulp "vscode-linux-x64-prepare-deb"
          npm run gulp "vscode-linux-x64-build-deb"

      - name: Compute sha256
        run: |
          set -e
          deb="$(find .build/linux/deb -name '*.deb' | head -n1)"
          cp "$deb" linux-x64.deb
          sha256sum linux-x64.deb | cut -d' ' -f1 > linux-x64.deb.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            linux-x64.deb
            linux-x64.deb.sha256
          retention-days: 7

  publish:
    needs: [classify, build-darwin, build-win32, build-linux]
    # Only release tags publish (classify: `publish` is false for branches and `platforms` subsets).
    # Stable keeps the old gate of every build job succeeding (before, a skipped or failed build
    # skipped this job through the implicit success()). Beta skips win32/linux on purpose, so it
    # only requires the macOS builds. `!cancelled()` is what lets a skipped need through at all.
    if: >-
      ${{ !cancelled()
      && needs.classify.outputs.publish == 'true'
      && needs.build-darwin.result == 'success'
      && (needs.classify.outputs.channel == 'beta'
      || (needs.build-win32.result == 'success' && needs.build-linux.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/upload (GitHub Release with artifacts)
    env:
      # `stable` or `beta`. Every R2 path, KV key and Release flag below branches on this only.
      CHANNEL: ${{ needs.classify.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Resolve version/commit
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Upload each artifact to R2 under an unguessable, commit-scoped path
      # and stamp its KV record. Object upload happens before the KV write so
      # the feed never advertises a URL that isn't live yet (see NOTES.md).
      #
      # Uploads go through R2's S3-compatible API: `wrangler r2 object put` caps
      # uploads at 300 MiB and every artifact exceeds that (seen in run
      # 28654273918). The S3 credentials come from a bucket-scoped R2 API token
      # (Object Read & Write on the artifacts bucket only), kept separate from
      # CF_API_TOKEN which is now KV-only.
      #
      # multipart_threshold is raised above the artifact size (315-336 MB) so
      # each upload is a single PUT: R2's CompleteMultipartUpload intermittently
      # fails with InvalidPart ("parts could not be found") on parallel multipart
      # uploads (seen twice on different files in run 28972859567). Single-part
      # PUT (R2 limit: 5 GiB) sidesteps that code path entirely.
      - name: Publish artifacts to R2 + update feed KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          set -e
          case "$CHANNEL" in
            stable|beta) ;;
            *) echo "::error::Unexpected release channel '$CHANNEL'"; exit 1 ;;
          esac
          export AWS_DEFAULT_REGION=auto AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          aws configure set default.s3.multipart_threshold 1GB
          EP="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"

          # For stable, kv_key is `stable:<platform>` and KEY is `stable/<platdir>/<commit>/<file>`,
          # the same strings this step used to hard-code. For beta both move under `beta`.
          publish() {
            local kv_key="$CHANNEL:$1" platdir="$2" file="$3" artdir="$4"
            local KEY="$CHANNEL/$platdir/${{ steps.meta.outputs.commit }}/$file"
            aws s3 cp "artifacts/$artdir/$file" "s3://${{ secrets.CF_R2_BUCKET }}/$KEY" --endpoint-url "$EP" --no-progress
            local HASH=$(tr -d '[:space:]' < "artifacts/$artdir/$file.sha256")
            wrangler kv key put --namespace-id "${{ secrets.CF_KV_NAMESPACE_ID }}" --remote \
              "$kv_key" "{\"commit\":\"${{ steps.meta.outputs.commit }}\",\"version\":\"${{ steps.meta.outputs.version }}\",\"productVersion\":\"${{ steps.meta.outputs.version }}\",\"url\":\"${{ secrets.CF_R2_PUBLIC_BASE_URL }}/$KEY\",\"sha256hash\":\"$HASH\",\"timestamp\":${{ steps.meta.outputs.timestamp }}}"
          }

          publish "darwin"           "darwin-x64"       "darwin-x64.zip"             "darwin-x64"
          publish "darwin-arm64"     "darwin-arm64"     "darwin-arm64.zip"           "darwin-arm64"
          # Beta is macOS-only (win32/linux were not built), so only stable publishes these.
          if [ "$CHANNEL" = "stable" ]; then
            publish "win32-x64-user"   "win32-x64-user"   "win32-x64-user-setup.exe"   "win32-x64"
            publish "win32-arm64-user" "win32-arm64-user" "win32-arm64-user-setup.exe" "win32-arm64"
            publish "linux-x64"        "linux-x64"        "linux-x64.deb"              "linux-x64"
          fi

          # Publish the app changelog for the in-app modal
          # (src/vs/paradis/contrib/releaseNotes/). Clients fetch it via
          # GET /api/changelog/:quality (cloudflare/update-server), where :quality is the
          # build's update channel, to read what newer versions change before installing them.
          # - stable (`changelog:stable`): the checkout's paradisChangelog.md is finalized
          #   before tagging, so it IS this release's notes.
          # - beta (`changelog:beta`): the same file as checked out, `## 未リリース` included and
          #   not renamed (CLAUDE.md). The beta's own notes live in the GitHub prerelease body.
          wrangler kv key put --namespace-id "${{ secrets.CF_KV_NAMESPACE_ID }}" --remote \
            --path src/vs/paradis/contrib/releaseNotes/electron-browser/media/paradisChangelog.md \
            "changelog:$CHANNEL"

      # Also attach the artifacts to a GitHub Release on the tag, so first-time
      # installs can be downloaded from the Releases page without digging into
      # R2. The auto-updater keeps using R2/KV above (Release asset URLs on a
      # private repo require auth, which end-user machines don't have).
      - name: Create GitHub Release with artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e -o pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p release-assets
          cp "artifacts/darwin-x64/darwin-x64.zip"               "release-assets/ParaCode-$TAG-darwin-x64.zip"
          cp "artifacts/darwin-arm64/darwin-arm64.zip"           "release-assets/ParaCode-$TAG-darwin-arm64.zip"
          if [ "$CHANNEL" = "stable" ]; then
            cp "artifacts/win32-x64/win32-x64-user-setup.exe"      "release-assets/ParaCode-$TAG-win32-x64-setup.exe"
            cp "artifacts/win32-arm64/win32-arm64-user-setup.exe"  "release-assets/ParaCode-$TAG-win32-arm64-setup.exe"
            cp "artifacts/linux-x64/linux-x64.deb"                 "release-assets/ParaCode-$TAG-linux-x64.deb"
          fi
          (cd release-assets && sha256sum -- * > "ParaCode-$TAG-SHA256SUMS.txt")
          if [ "$CHANNEL" = "beta" ]; then
            # A prerelease is never Latest, so the Releases page keeps pointing at the last stable.
            # The beta's notes are written after this run with `gh release edit --notes-file`
            # (CLAUDE.md). The edit branch is for re-running the same tag: it re-flags the existing
            # release so it can never end up as a normal release.
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --prerelease --latest=false
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
            fi
          else
            # Stable: same as before except `--notes-start-tag`. GitHub does not document which tag
            # generated notes start from when it is omitted, and a beta tag (off main) must never be
            # that start, so pin it to the previous stable release (build/lib/paradisReleaseChannel.ts).
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              PREV="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' \
                | node build/lib/paradisReleaseChannel.ts previous-stable "$TAG")"
              NOTES_START=()
              if [ -n "$PREV" ]; then
                NOTES_START=(--notes-start-tag "$PREV")
              fi
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes "${NOTES_START[@]}"
            fi
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*
