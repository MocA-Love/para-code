version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # PARA-PATCH: only update the fork's own workflows (.github/workflows/para-*.yml). Upstream workflows,
    # the devcontainer and @vscode/markdown-editor are left to upstream so merges do not conflict. Each
    # pattern excludes the names that first differ from the "para-" prefix at one position, so workflows
    # upstream adds later stay excluded too (dependabot-core matches these with File.fnmatch, which supports [^...]).
    exclude-paths:
      - ".github/workflows/[^p]*"
      - ".github/workflows/p[^a]*"
      - ".github/workflows/pa[^r]*"
      - ".github/workflows/par[^a]*"
      - ".github/workflows/para[^-]*"
