<!DOCTYPE html>
<html lang="en" style="width: 100%; height: 100%;">

<head>
	<meta charset="UTF-8">

	<!-- PARA-PATCH: this hash covers the inline script below, which this fork extends (service worker
		control recovery). Editing that script without recomputing the hash silently blocks it under
		CSP, and every webview then stays blank without throwing. Kept honest by
		src/vs/paradis/contrib/fileViewers/test/node/paradisWebviewServiceWorkerControl.test.ts. -->
	<meta http-equiv="Content-Security-Policy"
		content="default-src 'none'; script-src 'sha256-fJ35qZ+mZcuAYmSQV0jFPBmfw48yirDBon+AbEzr1fk=' 'self'; frame-src 'self'; style-src 'unsafe-inline';">

	<!-- Disable pinch zooming -->
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
</head>

<body style="margin: 0; overflow: hidden; width: 100%; height: 100%; overscroll-behavior-x: none;" role="document">
	<script async type="module">
		// @ts-check
		/// <reference lib="dom" />

		const isSafari = (
			navigator.vendor && navigator.vendor.indexOf('Apple') > -1 &&
			navigator.userAgent &&
			navigator.userAgent.indexOf('CriOS') === -1 &&
			navigator.userAgent.indexOf('FxiOS') === -1
		);

		const isFirefox = (
			navigator.userAgent &&
			navigator.userAgent.indexOf('Firefox') >= 0
		);

		const searchParams = new URL(location.toString()).searchParams;
		const ID = searchParams.get('id');
		const webviewOrigin = searchParams.get('origin');
		const onElectron = searchParams.get('platform') === 'electron';
		const disableServiceWorker = searchParams.has('disableServiceWorker');
		const expectedWorkerVersion = parseInt(searchParams.get('swVersion'));

		/**
		 * @param {string} name
		 * @param {Record<string, string>} [options]
		 */
		const perfMark = (name, options = {}) => {
			performance.mark(`webview/index.html/${name}`, {
				detail: {
					id: ID,
					...options
				}
			});
		}

		perfMark('scriptStart');

		/**
		 * Use polling to track focus of main webview and iframes within the webview
		 *
		 * @param {Object} handlers
		 * @param {() => void} handlers.onFocus
		 * @param {() => void} handlers.onBlur
		 */
		const trackFocus = ({ onFocus, onBlur }) => {
			const interval = 250;
			let isFocused = document.hasFocus();
			setInterval(() => {
				const target = getActiveFrame();
				const isCurrentlyFocused = document.hasFocus() || !!(target && target.contentDocument && target.contentDocument.body.classList.contains('vscode-context-menu-visible'));
				if (isCurrentlyFocused === isFocused) {
					return;
				}
				isFocused = isCurrentlyFocused;
				if (isCurrentlyFocused) {
					onFocus();
				} else {
					onBlur();
				}
			}, interval);
		};

		const getActiveFrame = () => {
			return /** @type {HTMLIFrameElement | undefined} */ (document.getElementById('active-frame'));
		};

		const getPendingFrame = () => {
			return /** @type {HTMLIFrameElement | undefined} */ (document.getElementById('pending-frame'));
		};

		/**
		 * @template T
		 * @param {T | undefined | null} obj
		 * @return {T}
		 */
		function assertIsDefined(obj) {
			if (typeof obj === 'undefined' || obj === null) {
				throw new Error('Found unexpected null');
			}
			return obj;
		}

		const vscodePostMessageFuncName = '__vscode_post_message__';

		const defaultStyles = document.createElement('style');
		defaultStyles.id = '_defaultStyles';
		defaultStyles.textContent = `
		@layer vscode-default {
			html {
				scrollbar-color: var(--vscode-scrollbarSlider-background) var(--vscode-editor-background);
			}

			body {
				overscroll-behavior-x: none;
				background-color: transparent;
				color: var(--vscode-editor-foreground);
				font-family: var(--vscode-font-family);
				font-weight: var(--vscode-font-weight);
				font-size: var(--vscode-font-size);
				margin: 0;
				padding: 0 20px;
			}

			img, video {
				max-width: 100%;
				max-height: 100%;
			}

			a, a code {
				color: var(--vscode-textLink-foreground);
			}

			p > a {
				text-decoration: var(--text-link-decoration);
			}

			a:hover {
				color: var(--vscode-textLink-activeForeground);
			}

			a:focus,
			input:focus,
			select:focus,
			textarea:focus {
				outline: 1px solid -webkit-focus-ring-color;
				outline-offset: -1px;
			}

			code {
				font-family: var(--monaco-monospace-font);
				color: var(--vscode-textPreformat-foreground);
				background-color: var(--vscode-textPreformat-background);
				padding: 1px 3px;
				border-radius: 4px;
			}

			pre code {
				padding: 0;
			}

			blockquote {
				background: var(--vscode-textBlockQuote-background);
				border-color: var(--vscode-textBlockQuote-border);
			}

			kbd {
				background-color: var(--vscode-keybindingLabel-background);
				color: var(--vscode-keybindingLabel-foreground);
				border-style: solid;
				border-width: 1px;
				border-radius: 3px;
				border-color: var(--vscode-keybindingLabel-border);
				border-bottom-color: var(--vscode-keybindingLabel-bottomBorder);
				box-shadow: inset 0 -1px 0 var(--vscode-widget-shadow);
				vertical-align: middle;
				padding: 1px 3px;
			}

			::-webkit-scrollbar {
				width: 10px;
				height: 10px;
			}

			::-webkit-scrollbar-corner {
				background-color: var(--vscode-editor-background);
			}

			::-webkit-scrollbar-thumb {
				background-color: var(--vscode-scrollbarSlider-background);
			}
			::-webkit-scrollbar-thumb:hover {
				background-color: var(--vscode-scrollbarSlider-hoverBackground);
			}
			::-webkit-scrollbar-thumb:active {
				background-color: var(--vscode-scrollbarSlider-activeBackground);
			}
			::highlight(find-highlight) {
				background-color: var(--vscode-editor-findMatchHighlightBackground);
			}
			::highlight(current-find-highlight) {
				background-color: var(--vscode-editor-findMatchBackground);
			}
		}`;

		/**
		 * @param {boolean} allowMultipleAPIAcquire
		 * @param {*} [state]
		 * @return {string}
		 */
		function getVsCodeApiScript(allowMultipleAPIAcquire, state) {
			const encodedState = state ? encodeURIComponent(state) : undefined;
			return /* js */`
					globalThis.acquireVsCodeApi = (function() {
						const originalPostMessage = window.parent['${vscodePostMessageFuncName}'].bind(window.parent);
						const doPostMessage = (channel, data, transfer) => {
							originalPostMessage(channel, data, transfer);
						};

						let acquired = false;

						let state = ${state ? `JSON.parse(decodeURIComponent("${encodedState}"))` : undefined};

						return () => {
							if (acquired && !${allowMultipleAPIAcquire}) {
								throw new Error('An instance of the VS Code API has already been acquired');
							}
							acquired = true;
							return Object.freeze({
								postMessage: function(message, transfer) {
									doPostMessage('onmessage', { message, transfer }, transfer);
								},
								setState: function(newState) {
									state = newState;
									doPostMessage('do-update-state', JSON.stringify(newState));
									return newState;
								},
								getState: function() {
									return state;
								}
							});
						};
					})();
					window.parent = window;
					window.top = window;
					window.frameElement = null;
				`;
		}

		// PARA-PATCH: service worker control recovery + health signals. Fork-owned block, see CLAUDE.md.
		// Field reports of intermittently blank rendered viewers (Markdown / HTML / image preview) all
		// come down to this webview never being claimed by its service worker: the registration reaches
		// `activated`, but `navigator.serviceWorker.controller` stays null, so the original unbounded
		// `controllerchange` wait never resolves. Nothing throws, so neither the notification nor Sentry
		// ever sees it. We poll for a missed event, then re-register once to force a fresh
		// install -> activate -> clients.claim(), and finally fail loudly so the host can recover.
		const PARA_SW_CONTROL_TIMEOUT_MS = 5000;
		const PARA_SW_CONTROL_POLL_MS = 100;

		/**
		 * Reports a fork-owned health signal to the host. Never throws: the caller is on the critical
		 * rendering path, and a missing signal must not turn into a blank webview by itself.
		 *
		 * @param {string} code
		 * @param {Record<string, string | number | boolean>} [detail]
		 */
		function paraReportSignal(code, detail) {
			try {
				hostMessaging.postMessage('para-webview-signal', { code, detail });
			} catch (e) {
				console.error(`Could not report webview signal '${code}': ${e}`);
			}
		}

		/**
		 * Resolves once a worker *other than* `previousController` controls this client, or after
		 * `timeoutMs`. Comparing against the worker that was in charge before matters: the caller also
		 * waits when a new worker is installing, and upstream relies on that wait so a stale worker
		 * cannot serve resources after a VS Code update. Merely checking "is there a controller"
		 * would let that case through.
		 *
		 * @param {ServiceWorker | null} previousController
		 * @param {number} timeoutMs
		 * @return {Promise<boolean>} whether a new worker took control
		 */
		function paraWaitForController(previousController, timeoutMs) {
			const hasNewController = () => {
				const current = navigator.serviceWorker.controller;
				return !!current && current !== previousController;
			};
			if (hasNewController()) {
				return Promise.resolve(true);
			}
			return new Promise(resolve => {
				let settled = false;
				const finish = (/** @type {boolean} */ controlled) => {
					if (settled) {
						return;
					}
					settled = true;
					clearInterval(poll);
					clearTimeout(timer);
					navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange);
					resolve(controlled);
				};
				const onControllerChange = () => {
					if (hasNewController()) {
						finish(true);
					}
				};
				navigator.serviceWorker.addEventListener('controllerchange', onControllerChange);
				// Polling covers the race the listener cannot: `controllerchange` may already have fired
				// between `register()` resolving and this listener being attached.
				const poll = setInterval(() => {
					if (hasNewController()) {
						finish(true);
					}
				}, PARA_SW_CONTROL_POLL_MS);
				const timer = setTimeout(() => finish(hasNewController()), timeoutMs);
			});
		}

		/**
		 * Waits for the service worker to control this client, re-registering once if it does not.
		 * Throws if control cannot be established, so the caller surfaces a fatal error instead of
		 * leaving the webview blank forever.
		 *
		 * @param {ServiceWorkerRegistration} registration
		 * @param {string} swPath
		 */
		async function paraWaitForServiceWorkerControl(registration, swPath) {
			const startedAt = Date.now();
			const previousController = navigator.serviceWorker.controller;

			if (await paraWaitForController(previousController, PARA_SW_CONTROL_TIMEOUT_MS)) {
				return;
			}

			// Re-registering runs install -> activate -> clients.claim() again, which fires
			// `controllerchange` for this client. Each webview gets its own origin, so this does
			// not disturb unrelated webviews.
			paraReportSignal('sw-control-timeout', { duration_ms: Date.now() - startedAt });
			let reregistered;
			try {
				await registration.unregister();
				reregistered = await navigator.serviceWorker.register(swPath, { type: 'module', updateViaCache: 'none' });
			} catch (error) {
				throw new Error(`Service worker did not take control and could not be re-registered: ${error}`);
			}

			if (await paraWaitForController(previousController, PARA_SW_CONTROL_TIMEOUT_MS)) {
				paraReportSignal('sw-control-recovered', { duration_ms: Date.now() - startedAt });
				return;
			}

			throw new Error(`Service worker did not take control of this webview within ${PARA_SW_CONTROL_TIMEOUT_MS}ms after re-registering (active: ${!!reregistered.active}, installing: ${!!reregistered.installing}, waiting: ${!!reregistered.waiting}).`);
		}

		// PARA-PATCH: `navigator.serviceWorker.register()` can stay pending forever, never resolving and
		// never rejecting (observed on a real install). The webview then never gets past
		// `await workerReady`, so the content is never applied and the pane stays blank without an
		// exception or a console error. paraWaitForServiceWorkerControl above only runs once register()
		// has settled, so it cannot reach this failure. Put a deadline on register/update themselves.
		const PARA_SW_REGISTER_TIMEOUT_MS = 5000;
		// Summing the individual deadlines makes the worst case hard to reason about, so the whole
		// setup also gets a budget. Past this point we render WITHOUT a service worker, which is what
		// bounds how long a viewer can sit blank. The host-side grace period
		// (PARADIS_VIEWER_SERVICE_WORKER_GRACE_MS) must exceed this budget: if it is shorter, the viewer
		// tears the webview down before it can fall back to rendering on its own.
		// paradisWebviewServiceWorkerControl.test.ts checks the two against each other.
		const PARA_SW_SETUP_BUDGET_MS = 20000;
		// Deciding whether a registration is version-less only reads the local registration ledger, so it
		// must answer immediately. Not answering is itself the anomaly, so cut it short rather than eating
		// into the registration budget.
		const PARA_SW_PROBE_TIMEOUT_MS = 1000;
		// A registration only counts as broken when it still holds no worker after this gap. The spec
		// creates the registration record before fetching the script, so a sibling client that is
		// mid-registration is legitimately version-less for a moment, while the measured broken state
		// stays that way for tens of seconds. Looking twice tells them apart, and a wider gap covers a
		// slow worker cold start while still saving most of the registration deadline.
		const PARA_SW_VERSIONLESS_CONFIRM_MS = 1000;
		const PARA_TIMEOUT_ERROR_NAME = 'ParaServiceWorkerTimeout';

		/**
		 * Bounds a promise that may never settle. Timing out rejects, so the caller can take the next step.
		 *
		 * @template T
		 * @param {Promise<T>} promise
		 * @param {number} timeoutMs
		 * @param {string} label
		 * @return {Promise<T>}
		 */
		function paraWithTimeout(promise, timeoutMs, label) {
			return Promise.race([
				promise,
				new Promise((_resolve, reject) => setTimeout(() => {
					const timeout = new Error(`${label} did not settle within ${timeoutMs}ms`);
					// Marks "never settled" apart from "explicitly refused" for the caller. Retrying a
					// refusal is pointless, and its reason is worth showing (third-party cookies on web).
					timeout.name = PARA_TIMEOUT_ERROR_NAME;
					reject(timeout);
				}, timeoutMs)),
			]);
		}

		/**
		 * @param {unknown} error
		 * @return {boolean} whether this is a deadline (false means the registration itself was refused)
		 */
		function paraIsTimeout(error) {
			return error instanceof Error && error.name === PARA_TIMEOUT_ERROR_NAME;
		}

		/**
		 * Drops a registration that exists but holds no worker in any slot, before registering again.
		 *
		 * PARA-PATCH: measured on a real install — `getRegistrations()` returns one registration whose
		 * `installing`, `waiting` and `active` are all null, from the first sample (~110ms) onwards. It
		 * stays that way: no service worker process is ever spawned and `navigator.serviceWorker.ready`
		 * never settles, so the viewer sits blank until its host watchdog tears it down. Registering on
		 * top of such a record does not repair it; the fork's existing recovery only starts after
		 * `register()` burns its full deadline, which wastes seconds of blank pane for a state that is
		 * detectable immediately. Clearing it first turns that case into a normal first registration.
		 *
		 * Never throws: this runs on the critical rendering path, and a failed probe must not be the
		 * reason a webview stays blank. Failing here just leaves the original behaviour in place.
		 */
		async function paraDiscardVersionlessRegistration() {
			const startedAt = Date.now();
			try {
				// Being controlled proves an active worker exists, so nothing here can be broken. Skipping
				// keeps the healthy majority off this path entirely.
				if (navigator.serviceWorker.controller) {
					return;
				}
				const probe = () => paraWithTimeout(
					navigator.serviceWorker.getRegistration(), PARA_SW_PROBE_TIMEOUT_MS, 'getRegistration');
				// A registration that is installing or waiting is mid-flight and must never be torn down.
				const isVersionless = (/** @type {ServiceWorkerRegistration | undefined} */ registration) =>
					!!registration && !registration.installing && !registration.waiting && !registration.active;
				if (!isVersionless(await probe())) {
					return;
				}
				// Look again before destroying anything. Registration creates the record before the script
				// is fetched, so a sibling client registering into this shared scope looks identical for a
				// moment; tearing that down would cost it its worker and cascade across siblings.
				await new Promise(resolve => setTimeout(resolve, PARA_SW_VERSIONLESS_CONFIRM_MS));
				const confirmed = await probe();
				if (!isVersionless(confirmed)) {
					return;
				}
				// Report either way. A confirmed-broken record that could not be cleared is the single most
				// interesting outcome, so it must not vanish into the catch below. `safe_` opts the key
				// past the diagnostics allowlist (see isParadisSafeExtraKey); a bare name is dropped
				// silently, which would take the misfire-vs-real distinction with it.
				try {
					const removed = await paraWithTimeout(confirmed.unregister(), PARA_SW_PROBE_TIMEOUT_MS, 'unregister');
					paraReportSignal('sw-versionless-registration-discarded', {
						duration_ms: Date.now() - startedAt,
						safe_removed: removed !== false,
					});
				} catch (unregisterError) {
					paraReportSignal('sw-versionless-registration-discarded', {
						duration_ms: Date.now() - startedAt,
						safe_removed: false,
					});
					throw unregisterError;
				}
			} catch (error) {
				console.error(`Could not clear a version-less service worker registration: ${error}`);
			}
		}

		/**
		 * Gets the service worker into a usable state, clearing and re-registering once if it stalls.
		 *
		 * Returns whether a service worker is usable. The point is that rendering continues even when
		 * this is false: body, styles and scripts are handed over the message channel, so they display
		 * without a service worker and only `vscode-resource` assets (local images) are lost. An
		 * incomplete render beats a blank pane.
		 *
		 * @param {string} swPath
		 * @return {Promise<boolean>}
		 */
		async function paraEstablishServiceWorker(swPath) {
			const startedAt = Date.now();
			const register = () => paraWithTimeout(
				navigator.serviceWorker.register(swPath, { type: 'module', updateViaCache: 'none' }),
				PARA_SW_REGISTER_TIMEOUT_MS, 'Service worker registration');

			await paraDiscardVersionlessRegistration();

			/** @type {ServiceWorkerRegistration} */
			let registration;
			try {
				registration = await register();
			} catch (error) {
				// A refusal will not change on a second try, so pass its reason up untouched (on web that
				// becomes the third-party cookie hint). Only a stall is worth recovering from.
				if (!paraIsTimeout(error)) {
					throw error;
				}
				paraReportSignal('sw-register-timeout', { duration_ms: Date.now() - startedAt, attempt: 1 });
				// A registration that never settled can linger, so clear it before registering again.
				// PARA-PATCH: these read and delete a local registration record, so they get the short probe
				// deadline rather than the registration one. With 5s each the cleanup plus both register
				// attempts summed past PARA_SW_SETUP_BUDGET_MS, so the budget cut the recovery off before
				// the retry could finish — the one path that is supposed to rescue a stuck registration
				// could never complete. That is why no `sw-register-recovered` was ever reported.
				try {
					const existing = await paraWithTimeout(navigator.serviceWorker.getRegistration(), PARA_SW_PROBE_TIMEOUT_MS, 'getRegistration');
					// PARA-PATCH: only clear a record that is not serving anyone. This scope is shared with
					// sibling webviews (same `IWebview.origin` across windows, and viewType-derived origins
					// upstream), so a healthy worker here may belong to another client whose registration
					// simply outran ours. Until the deadlines were shortened this path was cut off by the
					// setup budget and rarely ran; now that it completes, an unconditional unregister would
					// start actually destroying those siblings.
					if (existing && !existing.active && !existing.installing && !existing.waiting) {
						await paraWithTimeout(existing.unregister(), PARA_SW_PROBE_TIMEOUT_MS, 'unregister');
					}
				} catch (cleanupError) {
					console.error(`Could not clear the stuck service worker registration: ${cleanupError}`);
				}
				try {
					registration = await register();
					paraReportSignal('sw-register-recovered', { duration_ms: Date.now() - startedAt, attempt: 2 });
				} catch (retryError) {
					if (!paraIsTimeout(retryError)) {
						throw retryError;
					}
					console.error(`Continuing without a service worker: ${retryError}`);
					paraReportSignal('sw-unavailable', { duration_ms: Date.now() - startedAt, attempt: 2 });
					return false;
				}
			}

			if (navigator.serviceWorker.controller) {
				// A previous SW is already controlling. Force an update
				// check so we don't serve stale resources after a VS Code
				// update. register() resolves before the update check
				// completes, so we must call update() explicitly to wait
				// for the download + byte-comparison to finish.
				// PARA-PATCH: update() can stall the same way, so it gets a deadline too. Failing here is
				// not fatal (the old worker keeps serving), so carry on either way.
				try {
					registration = await paraWithTimeout(registration.update(), PARA_SW_REGISTER_TIMEOUT_MS, 'Service worker update');
				} catch (updateError) {
					console.error(`Service worker update check did not finish: ${updateError}`);
				}
			}

			// If a new worker was found, wait for it to take control via skipWaiting() + clients.claim() in the SW.
			if (
				// New worker
				registration.installing || registration.waiting
				// First ever load
				|| !navigator.serviceWorker.controller
			) {
				// PARA-PATCH: bounded wait instead of an open-ended `controllerchange` listener.
				// Under load the event can fire before this listener is attached (or `clients.claim()`
				// never reaches this client), and the original wait then never settles: `await workerReady`
				// below blocks forever, so the content is never written and the webview stays blank
				// without throwing anything. See paraWaitForServiceWorkerControl.
				try {
					await paraWaitForServiceWorkerControl(registration, swPath);
				} catch (controlError) {
					console.error(`Continuing without a controlling service worker: ${controlError}`);
					paraReportSignal('sw-unavailable', { duration_ms: Date.now() - startedAt });
					return false;
				}
			}
			return true;
		}

		/** @type {Promise<void>} */
		const workerReady = new Promise((resolve, reject) => {
			if (disableServiceWorker) {
				return resolve();
			}

			if (!areServiceWorkersEnabled()) {
				// This is a structural "service workers are unavailable here", so keep surfacing the
				// reason. The recovery below is for the case where one should work but never settles.
				return reject(new Error('Service Workers are not enabled. Webviews will not work. Try disabling private/incognito mode.'));
			}

			const swPath = encodeURI(`service-worker.js?v=${expectedWorkerVersion}&vscode-resource-base-authority=${searchParams.get('vscode-resource-base-authority')}&remoteAuthority=${searchParams.get('remoteAuthority') ?? ''}&platform=${searchParams.get('platform')}`);
			// PARA-PATCH: do not reject just because no service worker could be set up. Showing the
			// content without local images beats a blank pane. The budget around the whole setup covers
			// stalls that slip past the individual deadlines, and is what guarantees we always render.
			paraWithTimeout(paraEstablishServiceWorker(swPath), PARA_SW_SETUP_BUDGET_MS, 'Service worker setup')
				.then(() => resolve(), error => {
					// A refused registration still surfaces its reason: the cause is in the environment,
					// so degrading silently would leave the user with no idea how to fix it.
					if (!onElectron && error instanceof Error && error.message.includes('user denied permission')) {
						return reject(new Error(`Could not register service worker. Please make sure third party cookies are enabled: ${error}`));
					}
					// Anything else must not end in a blank pane -- getting the content up wins.
					console.error(`Continuing without a service worker: ${error}`);
					paraReportSignal('sw-unavailable', { duration_ms: PARA_SW_SETUP_BUDGET_MS });
					resolve();
				});
		});

		/**
		 *  @type {import('../webviewMessages').WebviewHostMessaging}
		 */
		const hostMessaging = new class HostMessaging {

			constructor() {
				this.channel = new MessageChannel();

				/** @type {Map<string, Array<(event: MessageEvent, data: any) => void>>} */
				this.handlers = new Map();

				this.channel.port1.onmessage = (e) => {
					const channel = e.data.channel;
					const handlers = this.handlers.get(channel);
					if (handlers) {
						for (const handler of handlers) {

				newFrame.contentWindow.addEventListener('keyup', handleInnerKeyup);

				/**
				 * @param {Document} contentDocument
				 */
				function onFrameLoaded(contentDocument) {
					perfMark('content/innerFrameLoaded')

					// Workaround for https://bugs.chromium.org/p/chromium/issues/detail?id=978325
					setTimeout(() => {
						contentDocument.open();
						contentDocument.write(newDocument);
						contentDocument.close();
						hookupOnLoadHandlers(newFrame);
						perfMark('content/wroteInnerContent')

						if (initialStyleVersion !== styleVersion) {
							applyStyles(contentDocument, contentDocument.body);
						}
					}, 0);
				}

				if (!options.allowScripts && isSafari) {
					// On Safari for iframes with scripts disabled, the `DOMContentLoaded` never seems to be fired: https://bugs.webkit.org/show_bug.cgi?id=33604
					// Use polling instead.
					const interval = setInterval(() => {
						// If the frame is no longer mounted, loading has stopped
						if (!newFrame.parentElement) {
							clearInterval(interval);
							return;
						}

						const contentDocument = assertIsDefined(newFrame.contentDocument);
						if (contentDocument.location.pathname.endsWith('/fake.html') && contentDocument.readyState !== 'loading') {
							clearInterval(interval);
							onFrameLoaded(contentDocument);
						}
					}, 10);
				} else {
					assertIsDefined(newFrame.contentWindow).addEventListener('DOMContentLoaded', e => {
						const contentDocument = e.target ? (/** @type {HTMLDocument} */ (e.target)) : undefined;
						onFrameLoaded(assertIsDefined(contentDocument));
					});
				}

				/**
				 * @param {Document} contentDocument
				 * @param {Window} contentWindow
				 */
				const onLoad = (contentDocument, contentWindow) => {
					if (contentDocument && contentDocument.body) {
						// Workaround for https://github.com/microsoft/vscode/issues/12865
						// check new scrollY and reset if necessary
						setInitialScrollPosition(contentDocument.body, contentWindow);
					}

					const newFrame = getPendingFrame();
					if (newFrame && newFrame.contentDocument && newFrame.contentDocument === contentDocument) {
						const wasFocused = document.hasFocus();
						const oldActiveFrame = getActiveFrame();
						oldActiveFrame?.remove();
						// Styles may have changed since we created the element. Make sure we re-style
						if (initialStyleVersion !== styleVersion) {
							applyStyles(newFrame.contentDocument, newFrame.contentDocument.body);
						}
						newFrame.setAttribute('id', 'active-frame');
						newFrame.style.visibility = 'visible';

						contentWindow.addEventListener('scroll', handleInnerScroll);
						contentWindow.addEventListener('wheel', handleWheel);

						if (wasFocused) {
							contentWindow.focus();
						}

						// Get body size
						const docEl = contentDocument.documentElement;
						if (docEl) {
							const postSize = () => {
								hostMessaging.postMessage('updated-intrinsic-content-size', {
									width: docEl.offsetWidth,
									height: docEl.offsetHeight
								});
							};

							const resizeObserver = new ResizeObserver(postSize);
							resizeObserver.observe(docEl);
							postSize();
						}

						pendingMessages.forEach((message) => {
							contentWindow.postMessage(message.message, window.origin, message.transfer);
						});
						pendingMessages = [];

						// PARA-PATCH: acknowledge only once the frame is actually promoted and visible.
						// Writing into the pending frame is not enough — if the promotion above is skipped
						// the webview stays blank, and the host must be able to tell that apart.
						paraReportSignal('content-applied', {});
					}
				};

				/**
				 * @param {HTMLIFrameElement} newFrame
				 */
				function hookupOnLoadHandlers(newFrame) {
					clearTimeout(loadTimeout);
					loadTimeout = undefined;
					loadTimeout = setTimeout(() => {
						clearTimeout(loadTimeout);
						loadTimeout = undefined;
						onLoad(assertIsDefined(newFrame.contentDocument), assertIsDefined(newFrame.contentWindow));
					}, 200);

					const contentWindow = assertIsDefined(newFrame.contentWindow);

					contentWindow.addEventListener('load', function (e) {
						const contentDocument = /** @type {Document} */ (e.target);

						if (loadTimeout) {
							clearTimeout(loadTimeout);
							loadTimeout = undefined;
							onLoad(contentDocument, this);
						}
					});

					// Bubble out various events
					contentWindow.addEventListener('click', handleInnerClick);
					contentWindow.addEventListener('auxclick', handleAuxClick);
					contentWindow.addEventListener('keydown', handleInnerKeydown);
					contentWindow.addEventListener('keyup', handleInnerKeyup);
					contentWindow.addEventListener('contextmenu', e => {
						if (e.defaultPrevented) {
							// Extension code has already handled this event
							return;
						}

						e.preventDefault();

						/** @type { Record<string, boolean>} */
						let context = {};

						/** @type {HTMLElement | null} */
						let el = e.target;
						while (true) {
							if (!el) {
								break;
							}

							// Search self/ancestors for the closest context data attribute
							el = el.closest('[data-vscode-context]');
							if (!el) {
								break;
							}

							try {
								context = { ...JSON.parse(el.dataset.vscodeContext), ...context };
							} catch (e) {
								console.error(`Error parsing 'data-vscode-context' as json`, el, e);
							}

							el = el.parentElement;
						}

						hostMessaging.postMessage('did-context-menu', {
							clientX: e.clientX,
							clientY: e.clientY,
							context: context
						});
					});

					contentWindow.addEventListener('dragenter', handleInnerDragStartEvent);
					contentWindow.addEventListener('dragover', handleInnerDragEvent);
					contentWindow.addEventListener('drag', handleInnerDragEvent);
					contentWindow.addEventListener('drop', handleInnerDropEvent);

					unloadMonitor.onIframeLoaded(newFrame);
				}

			});

			// propagate vscode-context-menu-visible class
			hostMessaging.onMessage('set-context-menu-visible', (_event, data) => {
				const target = getActiveFrame();
				if (target && target.contentDocument) {
					target.contentDocument.body.classList.toggle('vscode-context-menu-visible', data.visible);
				}
			});

			hostMessaging.onMessage('set-title', async (_event, data) => {
				const target = getActiveFrame();
				if (target) {
					target.title = data;
				}
			});

			// Forward message to the embedded iframe
			hostMessaging.onMessage('message', (_event, data) => {
				const pending = getPendingFrame();
				if (!pending) {
					const target = getActiveFrame();
					if (target) {
						assertIsDefined(target.contentWindow).postMessage(data.message, window.origin, data.transfer);
						return;
					}
				}
				pendingMessages.push(data);
			});

			hostMessaging.onMessage('initial-scroll-position', (_event, progress) => {
				initData.initialScrollProgress = progress;
			});

			hostMessaging.onMessage('execCommand', (_event, data) => {
				const target = getActiveFrame();
				if (!target) {
					return;
				}
				assertIsDefined(target.contentDocument).execCommand(data);
			});

			/** @type {string | undefined} */
			let lastFindValue = undefined;

			hostMessaging.onMessage('find', (_event, data) => {
				const target = getActiveFrame();
				if (!target) {
					return;
				}

				if (!data.previous && lastFindValue !== data.value && target.contentWindow) {
					// Reset selection so we start search at the head of the last search
					const selection = target.contentWindow.getSelection();
					if (selection) {
						selection.collapse(selection.anchorNode);
					}
				}
				lastFindValue = data.value;

				const didFind = (/** @type {any} */ (target.contentWindow)).find(
					data.value,
					/* caseSensitive*/ false,
					/* backwards*/ data.previous,
					/* wrapAround*/ true,
					/* wholeWord */ false,
					/* searchInFrames*/ false,
					false);
				hostMessaging.postMessage('did-find', didFind);
			});

			hostMessaging.onMessage('find-stop', (_event, data) => {
				const target = getActiveFrame();
				if (!target) {
					return;
				}

				lastFindValue = undefined;

				if (!data.clearSelection && target.contentWindow) {
					const selection = target.contentWindow.getSelection();
					if (selection) {
						for (let i = 0; i < selection.rangeCount; i++) {
							selection.removeRange(selection.getRangeAt(i));
						}
					}
				}
			});

			trackFocus({
				onFocus: () => hostMessaging.postMessage('did-focus', undefined),
				onBlur: () => hostMessaging.postMessage('did-blur', undefined)
			});

			(/** @type {any} */ (window))[vscodePostMessageFuncName] = (/** @type {string} */ command, /** @type {any} */ data) => {
				switch (command) {
					case 'onmessage':
					case 'do-update-state':
						hostMessaging.postMessage(command, data);
						break;
				}
			};

			hostMessaging.signalReady();
		});
	</script>
</body>

</html>
