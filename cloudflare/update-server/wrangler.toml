# PARA-CODE: fork-owned config (Para Code) — not present in upstream microsoft/vscode. See CLAUDE.md.
name = "para-code-update-server"
main = "src/index.ts"
compatibility_date = "2026-07-01"
# account_id intentionally omitted; resolved from the
# CLOUDFLARE_ACCOUNT_ID environment variable (or a single-account token via
# `wrangler login`) before running `wrangler deploy`.

[[kv_namespaces]]
binding = "RELEASES"
id = "95abfbef8a784048975904f37347daac" # title: para-code-update-releases

[[routes]]
pattern = "paracode-updates.paradis.ltd"
custom_domain = true

[vars]
# Defense in depth for the update feed (/api/update). The primary access
# control is the Access Application (Service Auth) configured separately in
# the Cloudflare Zero Trust dashboard, scoped to /api/update; /api/changelog is
# public by design and is never checked here.
# When both values are set, the worker verifies the Cf-Access-Jwt-Assertion
# (signature against the team's keys, aud, iss, exp, nbf) and answers 401
# otherwise, so the feed stays closed if the Access Application is detached.
# Setting CF_ACCESS_AUD without CF_ACCESS_TEAM_DOMAIN closes the feed entirely.
# Keep the real values out of this public file: set them on the deployed
# worker (`wrangler secret put CF_ACCESS_AUD` / `CF_ACCESS_TEAM_DOMAIN`).
# CF_ACCESS_AUD = ""          # Access Application > Overview > Application Audience (AUD) Tag
# CF_ACCESS_TEAM_DOMAIN = ""  # https://<team>.cloudflareaccess.com
